# Placeholder fee assumption and stop-rule thresholds for `just report-pnl` (issue #70).
# The stop-rule numbers are conservative placeholders pending founders' decision (issue #23:
# "Agree how much money we're willing to lose"). They are NOT the real, approved stop rule —
# issue #70's Done-when is explicit: "The stop rule is written down and approved by both founders
# before the first trade happens." This file's job is only to make report-pnl's stop-rule check
# real and testable today; do not treat a "not triggered" result as founders' sign-off.
# Tightening these numbers needs no approval; loosening does, by the same logic as root
# CLAUDE.md rule 4 (this file is outside config/limits/**, the actual protected zone, because no
# funded account or venue exists yet to apply a risk limit to).

[fees]
# Placeholder execution-cost assumption (basis points of notional per fill), applied identically
# to the agent and the buy-and-hold baseline so the comparison stays fair. No venue is chosen yet
# (config/venues/ is empty; ADR-0003/ADR-0020 are still Proposed), so there is no real fee
# schedule to read here yet — replace this once one exists.
fee_bps = "10"

[stop_rule]
# Placeholder only, pending founders' decision #23. The founder stated on 2026-09-28 that the
# Robinhood Agentic account is funded with $50 total; $5 is 10% of it, so the stop rule trips
# long before the account is gone (docs/decisions/0023-budget-and-caps.md).
max_drawdown_usd = "5"
max_consecutive_days_behind_buy_and_hold = 5
# Founder rule (2026-09-29), already approved -- unlike the two thresholds above, this one is not
# pending #23: stop trading for good once cumulative realized+unrealized profit (after fees) on
# the $50 Agentic account reaches $400. Loosening this number needs the same founder sign-off as
# any other protected limit (root CLAUDE.md rule 4); tightening it does not.
take_profit_usd = "400"

[account]
# Read by `just report-progress` (scripts/reports/progress_report.py). Not a risk limit: nothing
# here changes what the engine allows. Starting capital is the founder-stated funding of the
# Robinhood Agentic account (2026-09-28, docs/decisions/0023-budget-and-caps.md). The target is
# the owner's $5,000 goal, reported only as a ratio of confirmed equity, never projected;
# docs/NOW.md's "Founder target" section still says $500 by 2026-10-29.
starting_capital_usd = "50"
target_equity_usd = "5000"
