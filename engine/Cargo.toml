[workspace]
resolver = "3"
members = ["crates/*", "benches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
qc-core = { path = "crates/core" }
qc-orderbook = { path = "crates/orderbook" }
qc-strategy-runtime = { path = "crates/strategy-runtime" }
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = true
